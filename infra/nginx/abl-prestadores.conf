# Nginx da Gestão de Prestadores (fatia 9, D9.5).
# Copiar para /etc/nginx/sites-available/abl-prestadores, trocar DOMINIO e ativar
# com um link em sites-enabled. O Certbot acrescenta o bloco 443 e o redirecionamento.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    root /var/www/abl-prestadores/public;
    index index.php;

    charset utf-8;

    # Planilha de até 2 MB e foto de perfil, com folga.
    client_max_body_size 8M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Maior que o timeout do UAU (30 s): a tela nunca chama o UAU, mas o upload lê a planilha.
        fastcgi_read_timeout 120;
    }

    # Arquivos ocultos (.env, .git), exceto o desafio do Certbot.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/abl-prestadores.access.log;
    error_log  /var/log/nginx/abl-prestadores.error.log;
}
