; PHP da Gestão de Prestadores (fatia 9, D9.5).
; Copiar para /etc/php/8.4/fpm/conf.d/ e /etc/php/8.4/cli/conf.d/ e reiniciar o php8.4-fpm.
date.timezone = America/Sao_Paulo
memory_limit = 256M
upload_max_filesize = 5M
post_max_size = 8M
max_execution_time = 120
expose_php = Off

; OPcache: o deploy roda php artisan optimize e reinicia o Horizon;
; validate_timestamps continua ligado porque o código muda no lugar (git pull).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
