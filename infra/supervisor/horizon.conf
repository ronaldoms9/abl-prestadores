; Horizon da Gestão de Prestadores (fatia 9, D9.5).
; Copiar para /etc/supervisor/conf.d/abl-prestadores-horizon.conf e rodar
; supervisorctl reread && supervisorctl update.
[program:abl-prestadores-horizon]
process_name=%(program_name)s
command=php /var/www/abl-prestadores/artisan horizon
user=deploy
autostart=true
autorestart=true
; Espera o job mais longo terminar antes de parar (fila uau: timeout de 900 s).
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/abl-prestadores/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
